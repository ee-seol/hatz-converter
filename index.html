<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>하츠 배차 변환기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; display: flex; flex-direction: column; }

.top-bar { background: #1a1a2e; color: #fff; padding: 16px 32px; }
.top-bar .logo { font-size: 20px; font-weight: 700; }
.top-bar .sub  { font-size: 13px; color: #8899bb; margin-top: 4px; }

.container { max-width: 800px; margin: 0 auto; padding: 60px 24px; flex: 1; }

.title-area { text-align: center; margin-bottom: 48px; }
.title-area h1 { font-size: 26px; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; }
.title-area p  { font-size: 15px; color: #6b7280; }

.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

.type-card {
  background: #fff;
  border-radius: 16px;
  padding: 40px 32px;
  text-align: center;
  cursor: pointer;
  border: 2px solid #e5e7eb;
  transition: all 0.2s;
  text-decoration: none;
  color: inherit;
  display: block;
}
.type-card:hover { border-color: #4f8ef7; box-shadow: 0 8px 24px rgba(79,142,247,0.15); transform: translateY(-2px); }
.type-card .icon { font-size: 52px; margin-bottom: 16px; }
.type-card .name { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
.type-card .desc { font-size: 13px; color: #6b7280; line-height: 1.6; }
.type-card .badge { display: inline-block; margin-top: 16px; padding: 5px 14px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.badge-blue  { background: #dbeafe; color: #1e40af; }
.badge-green { background: #dcfce7; color: #166534; }

footer { text-align: center; padding: 24px; color: #9ca3af; font-size: 12px; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">🚚 하츠 배차 변환기</div>
  <div class="sub">배차 리스트 → W1 대량배차 업로드 양식</div>
</div>

<div class="container">
  <div class="title-area">
    <h1>배차 유형을 선택해주세요</h1>
    <p>업무에 맞는 변환기를 선택하면 바로 시작할 수 있어요</p>
  </div>

  <div class="card-grid">
    <a class="type-card" href="특판배차_변환기.html">
      <div class="icon">📦</div>
      <div class="name">특판 배차</div>
      <div class="desc">거래처에서 받은 특판 배차<br>리스트를 W1 양식으로 변환</div>
      <div class="badge badge-blue">특판배차_XXXXXX.xlsx</div>
    </a>
    <a class="type-card" href="유통배차_변환기.html">
      <div class="icon">🚛</div>
      <div class="name">유통 배차</div>
      <div class="desc">거래처에서 받은 유통 배차<br>리스트를 W1 양식으로 변환</div>
      <div class="badge badge-green">유통배차_XXXXXX.xlsx</div>
    </a>
  </div>
</div>

<footer>하츠 운영기획팀 · 배차 변환기</footer>
</body>
</html>
